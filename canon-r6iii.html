<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="R6 III Guide">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#1c2e3d">
<title>Canon EOS R6 Mark III · Alaska Field Guide</title>
<style>
:root {
  --paper: #f5efe2;
  --paper-2: #ece4d2;
  --paper-3: #e4dcc6;
  --ink: #1c2e3d;
  --ink-2: #4b5b6a;
  --ink-3: #7d8a96;
  --rule: #c9bfa9;
  --rule-2: #d8d0bc;
  --gold: #b07b1f;
  --accent: #14524f;
  --ocean: #1e3a5f;

  --c-wild:    #0F4C5C;
  --c-wild-bg: #d6e4e9;
  --c-land:    #2d5d3a;
  --c-land-bg: #d9e6da;
  --c-port:    #7C2D6F;
  --c-port-bg: #ead8e2;
  --c-video:   #6B2737;
  --c-video-bg:#ead0d4;
  --c-setup:   #B45309;
  --c-setup-bg:#f3e3c8;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, -apple-system, sans-serif;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 16px;
  line-height: 1.45;
  user-select: none;
  -webkit-user-select: none;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(1200px 800px at 80% -10%, rgba(176, 123, 31, 0.08), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, rgba(20, 82, 79, 0.07), transparent 60%);
  pointer-events: none;
  z-index: 0;
}

#deck {
  position: fixed; inset: 0;
  display: flex;
  align-items: stretch;
  justify-content: center;
  padding: calc(var(--safe-top) + 56px) 16px calc(var(--safe-bottom) + 64px);
  z-index: 1;
}

.slide {
  width: 100%;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 4px 24px;
  animation: fadein 240ms ease-out;
}
@keyframes fadein { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none;} }

.slide-eyebrow {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 0 2px;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.slide-eyebrow .day-tag {
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.18em;
}
.slide-title {
  font-family: "Iowan Old Style", "Cochin", Georgia, serif;
  font-weight: 700;
  font-size: clamp(28px, 7vw, 38px);
  line-height: 1.05;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 0;
}
.slide-subtitle {
  font-size: 16px;
  color: var(--ink-2);
  margin: -4px 0 0;
}

.card {
  background: var(--paper-2);
  border: 1px solid var(--rule-2);
  border-radius: 14px;
  padding: 14px 16px;
}

.card h3 {
  margin: 0 0 8px;
  font-family: "Iowan Old Style", "Cochin", Georgia, serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--ink);
}
.card h4 {
  margin: 12px 0 4px;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-2);
  font-weight: 700;
}
.card p { margin: 6px 0; font-size: 14.5px; color: var(--ink); }
.card .muted { color: var(--ink-2); font-size: 13.5px; }
.card ul { margin: 6px 0 0; padding-left: 20px; }
.card li { font-size: 14.5px; margin: 4px 0; color: var(--ink); }
.card li strong { color: var(--ink); }
.card code, .mono {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  background: rgba(28, 46, 61, 0.07);
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink);
}

/* Lens / Activity tag chips */
.tag {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  letter-spacing: 0.08em;
  font-weight: 700;
  text-transform: uppercase;
  margin-right: 6px;
  margin-bottom: 4px;
}
.tag-wild   { background: var(--c-wild-bg); color: var(--c-wild); }
.tag-land   { background: var(--c-land-bg); color: var(--c-land); }
.tag-port   { background: var(--c-port-bg); color: var(--c-port); }
.tag-video  { background: var(--c-video-bg); color: var(--c-video); }
.tag-setup  { background: var(--c-setup-bg); color: var(--c-setup); }
.tag-50     { background: #e6e3d4; color: var(--accent); }
.tag-100    { background: #f3e3c8; color: var(--gold); }
.tag-800    { background: #d8dde6; color: var(--ocean); }

/* Color-accented cards */
.card.wild   { background: linear-gradient(135deg, #e1eef2, var(--c-wild-bg)); border-color: #b8d0d7; }
.card.land   { background: linear-gradient(135deg, #e3eee2, var(--c-land-bg)); border-color: #b8cfbb; }
.card.port   { background: linear-gradient(135deg, #f0e0e9, var(--c-port-bg)); border-color: #d6b6c6; }
.card.video  { background: linear-gradient(135deg, #f0d6d9, var(--c-video-bg)); border-color: #d6b3b7; }
.card.setup  { background: linear-gradient(135deg, #f6e6c8, var(--c-setup-bg)); border-color: #d6b97f; }
.card.lowlight { background: linear-gradient(135deg, #d8dde6, #cad0db); border-color: #b6bccb; color: var(--ink); }

/* Settings table — key/value cards */
.settings-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
  margin-top: 8px;
}
.setting {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.55);
  border: 1px solid rgba(28, 46, 61, 0.08);
  border-radius: 8px;
  gap: 12px;
}
.setting .k {
  font-size: 12.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-2);
  font-weight: 600;
  flex: 0 0 auto;
}
.setting .v {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--ink);
  text-align: right;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}

/* Checklist */
.checklist .check-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid rgba(28, 46, 61, 0.08);
  border-radius: 10px;
  margin-bottom: 6px;
  cursor: pointer;
}
.checklist .check-item .box {
  flex: 0 0 auto;
  width: 20px;
  height: 20px;
  border-radius: 5px;
  border: 1.5px solid var(--ink-3);
  background: rgba(255,255,255,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
  font-size: 14px;
  color: transparent;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.checklist .check-item.done .box {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.checklist .check-item.done .label {
  text-decoration: line-through;
  color: var(--ink-3);
}
.checklist .label {
  font-size: 14.5px;
  color: var(--ink);
  line-height: 1.4;
}
.checklist .label strong { display: block; margin-bottom: 2px; }
.checklist .label .menu-path {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12px;
  color: var(--ink-2);
  background: rgba(28,46,61,0.06);
  padding: 1px 4px;
  border-radius: 3px;
  margin-top: 4px;
  display: inline-block;
}

/* Mode dial visual */
.dial {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  margin-top: 8px;
}
.dial .mode {
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid rgba(28, 46, 61, 0.08);
  border-radius: 8px;
  padding: 8px 10px;
}
.dial .mode .m-letter {
  display: inline-block;
  width: 30px;
  text-align: center;
  background: var(--ink);
  color: var(--paper);
  border-radius: 6px;
  padding: 2px 0;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-weight: 700;
  font-size: 13px;
  margin-right: 8px;
  vertical-align: middle;
}
.dial .mode.av .m-letter { background: var(--accent); }
.dial .mode .m-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  vertical-align: middle;
}
.dial .mode .m-desc {
  display: block;
  font-size: 12px;
  color: var(--ink-2);
  margin-top: 4px;
  line-height: 1.35;
}

/* Two-column "you set" vs "camera sets" */
.av-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}
.av-col {
  background: rgba(255, 255, 255, 0.55);
  border: 1px solid rgba(28,46,61,0.08);
  border-radius: 10px;
  padding: 10px 12px;
}
.av-col h5 {
  margin: 0 0 6px;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-2);
  font-weight: 700;
}
.av-col h5.you  { color: var(--accent); }
.av-col h5.cam  { color: var(--gold); }
.av-col ul { padding-left: 18px; margin: 0; }
.av-col li { font-size: 13.5px; margin: 4px 0; }

/* Scenario blocks */
.scenario {
  background: rgba(255,255,255,0.5);
  border: 1px solid rgba(28,46,61,0.08);
  border-radius: 10px;
  padding: 10px 12px;
  margin: 8px 0 0;
}
.scenario .scen-title {
  font-weight: 700;
  font-size: 14px;
  color: var(--ink);
  margin-bottom: 4px;
}
.scenario .scen-body {
  font-size: 13.5px;
  color: var(--ink-2);
  line-height: 1.4;
}

/* Pro tip */
.tip {
  background: linear-gradient(135deg, #fff4d6, #f7e8b3);
  border: 1px solid #e2cc7f;
  border-radius: 12px;
  padding: 10px 14px;
  margin-top: 10px;
  font-size: 14px;
  color: #5e4810;
}
.tip strong { display: block; margin-bottom: 2px; color: #4a3608; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }

/* Warn */
.warn {
  background: linear-gradient(135deg, #f8d8d8, #f1c4c4);
  border: 1px solid #d99a9a;
  border-radius: 12px;
  padding: 10px 14px;
  margin-top: 10px;
  font-size: 14px;
  color: #6b2222;
}
.warn strong { display: block; margin-bottom: 2px; color: #5a1c1c; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }

/* Title slide */
.title-slide {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 32px 16px;
  gap: 12px;
}
.title-slide .eyebrow {
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 700;
}
.title-slide .big {
  font-family: "Iowan Old Style", "Cochin", Georgia, serif;
  font-weight: 700;
  font-size: clamp(36px, 9vw, 54px);
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.title-slide .small {
  font-size: 17px;
  color: var(--ink-2);
  max-width: 400px;
}
.title-slide .kit-card {
  margin-top: 12px;
  background: rgba(255,255,255,0.5);
  border: 1px solid var(--rule-2);
  border-radius: 14px;
  padding: 14px 18px;
  max-width: 380px;
  width: 100%;
}
.title-slide .kit-card .kit-eyebrow {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 700;
  margin-bottom: 8px;
}
.title-slide .kit-card .kit-line {
  font-size: 14.5px;
  color: var(--ink);
  margin: 4px 0;
  text-align: left;
}
.title-slide .swipe-hint {
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-top: 22px;
  font-weight: 600;
}
.title-slide .swipe-hint::before { content: '←  '; opacity: 0.5; }
.title-slide .swipe-hint::after  { content: '  →'; opacity: 0.5; }
.title-slide .build-stamp {
  font-size: 10px;
  color: var(--ink-3);
  margin-top: 18px;
  opacity: 0.65;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.title-slide .force-refresh {
  margin-top: 10px;
  background: rgba(28,46,61,0.06);
  border: 1px solid var(--rule);
  color: var(--ink-2);
  padding: 6px 14px;
  font-size: 12px;
  font-family: inherit;
  border-radius: 8px;
  cursor: pointer;
  letter-spacing: 0.06em;
}
.title-slide .force-refresh:active { background: rgba(28,46,61,0.12); }

/* Position pill / dots */
#position-indicator {
  position: fixed;
  top: calc(var(--safe-top) + 14px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-2);
  background: rgba(245, 239, 226, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--rule-2);
  z-index: 5;
  font-weight: 600;
  white-space: nowrap;
  max-width: 60vw;
  overflow: hidden;
  text-overflow: ellipsis;
}

#dots-container {
  position: fixed;
  bottom: calc(var(--safe-bottom) + 14px);
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  z-index: 5;
  pointer-events: none;
}
#dots {
  display: flex;
  gap: 6px;
  padding: 6px 10px;
  background: rgba(245, 239, 226, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 999px;
  border: 1px solid var(--rule-2);
  pointer-events: auto;
  max-width: 88vw;
  overflow-x: auto;
  scrollbar-width: none;
}
#dots::-webkit-scrollbar { display: none; }
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ink-3);
  opacity: 0.45;
  border: none;
  padding: 0;
  flex: 0 0 auto;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.15s;
}
.dot.active {
  background: var(--accent);
  opacity: 1;
  transform: scale(1.3);
}

/* Tap zones */
#tap-prev, #tap-next {
  position: fixed;
  top: calc(var(--safe-top) + 56px);
  bottom: calc(var(--safe-bottom) + 60px);
  width: 22%;
  border: none;
  background: transparent;
  z-index: 4;
  cursor: pointer;
}
#tap-prev { left: 0; }
#tap-next { right: 0; }
#tap-prev:focus, #tap-next:focus { outline: none; }

.swipe-arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  font-size: 28px;
  color: var(--ink-3);
  background: rgba(245, 239, 226, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--rule-2);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 5;
  cursor: pointer;
  line-height: 1;
  font-weight: 300;
  padding-bottom: 3px;
}
#arrow-prev { left: 14px; }
#arrow-next { right: 14px; }
@media (min-width: 640px) {
  .swipe-arrow { display: flex; }
}

/* Offline banner */
#offline-banner {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  text-align: center;
  background: #2a2018;
  color: #e6c46c;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-weight: 700;
  padding: 4px 8px;
  z-index: 99;
  opacity: 0;
  pointer-events: none;
  transform: translateY(100%);
  transition: opacity 0.2s, transform 0.2s;
}
#offline-banner.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

/* Add-to-home hint */
#a2hs-hint {
  position: fixed;
  left: 16px; right: 16px;
  bottom: calc(var(--safe-bottom) + 56px);
  background: var(--ink);
  color: var(--paper);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 12.5px;
  z-index: 8;
  display: none;
  text-align: center;
  line-height: 1.45;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
}
#a2hs-hint.visible { display: block; }
#a2hs-hint button {
  background: var(--gold);
  color: white;
  border: none;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  margin-left: 8px;
  cursor: pointer;
}

/* Hide scrollbar visually but keep scrollable */
.slide::-webkit-scrollbar { width: 0; background: transparent; }

/* Cheat sheet table */
.cheat-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
  font-size: 13px;
}
.cheat-table th, .cheat-table td {
  text-align: left;
  padding: 6px 8px;
  border-bottom: 1px solid rgba(28,46,61,0.1);
  vertical-align: top;
}
.cheat-table th {
  background: rgba(28,46,61,0.08);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.cheat-table td:first-child {
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
}
.cheat-table td .mono { font-size: 12px; }
.cheat-table tr:last-child td { border-bottom: none; }

/* Visual exposure-triangle */
.tri {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin-top: 8px;
}
.tri .v {
  background: rgba(255,255,255,0.55);
  border: 1px solid rgba(28,46,61,0.08);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}
.tri .v .lbl {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 700;
}
.tri .v .val {
  font-family: "Iowan Old Style", Georgia, serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  margin-top: 4px;
}
.tri .v .who {
  font-size: 11px;
  font-weight: 700;
  margin-top: 2px;
  padding: 2px 6px;
  border-radius: 999px;
  display: inline-block;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.tri .v.you .who { background: var(--c-land-bg); color: var(--c-land); }
.tri .v.cam .who { background: var(--c-setup-bg); color: var(--c-setup); }
</style>
</head>
<body>
<div id="position-indicator"></div>
<div id="deck"></div>
<button id="tap-prev" aria-label="Previous"></button>
<button id="tap-next" aria-label="Next"></button>
<div class="swipe-arrow" id="arrow-prev">‹</div>
<div class="swipe-arrow" id="arrow-next">›</div>
<div id="dots-container"><div id="dots"></div></div>

<script>
/* Build stamp — set before any rendering happens */
window.__BUILD_STAMP__ = "2026-05-26";

/* ============================================================
   DOM helpers
   ============================================================ */
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
  }
  if (children) {
    if (!Array.isArray(children)) children = [children];
    for (const c of children) {
      if (c == null) continue;
      if (typeof c === "string") e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    }
  }
  return e;
}
function card(cls, children) { return el("div", { class: "card " + (cls || "") }, children); }
function eyebrow(tag, label) {
  return el("div", { class: "slide-eyebrow" }, [
    el("span", { class: "day-tag" }, tag),
    el("span", null, label),
  ]);
}
function setting(k, v) {
  return el("div", { class: "setting" }, [
    el("span", { class: "k" }, k),

   DECK
   ============================================================ */

  { kind: "title",     pos: "Welcome",         build: buildTitleSlide },
  { kind: "setup",     pos: "Quick Setup",     build: buildSetupSlide },
  { kind: "mode",      pos: "Mode Dial",       build: buildModeDialSlide },

  { kind: "landscape", pos: "Landscapes",      build: buildLandscapeSlide },
  { kind: "portrait",  pos: "Portraits",       build: buildPortraitSlide },
  { kind: "lowlight",  pos: "Low Light",       build: buildLowLightSlide },
  { kind: "video",     pos: "Video",           build: buildVideoSlide },
  { kind: "drive",     pos: "Drive & Burst",   build: buildDriveSlide },
  { kind: "field",     pos: "Field Tips",      build: buildPracticalSlide },
  { kind: "cheat",     pos: "Cheat Sheet",     build: buildCheatSheet },
];

let currentIndex = 0;

function renderCurrent() {
  const deck = document.getElementById("deck");
  deck.innerHTML = "";
  const slide = SLIDES[currentIndex].build();
  deck.appendChild(slide);
  document.getElementById("position-indicator").textContent = SLIDES[currentIndex].pos;
  renderDots();
  const h = SLIDES[currentIndex].kind;
  if (location.hash.replace(/^#/, "") !== h) {
    history.replaceState(null, "", "#" + h);
  }
  slide.scrollTop = 0;
}

function renderDots() {
  const c = document.getElementById("dots");
  c.innerHTML = "";
  SLIDES.forEach((s, i) => {
    const d = el("button", { class: "dot" + (i === currentIndex ? " active" : ""), "aria-label": s.pos });
    d.addEventListener("click", () => go(i));
    c.appendChild(d);
  });
  // scroll active into view in the dots row
  const active = c.querySelector(".dot.active");
  if (active) active.scrollIntoView({ block: "nearest", inline: "center" });
}

function go(i) {
  if (i < 0 || i >= SLIDES.length) return;
  currentIndex = i;
  renderCurrent();
}
function next() { go(Math.min(SLIDES.length - 1, currentIndex + 1)); }
function prev() { go(Math.max(0, currentIndex - 1)); }

/* Nav */
document.getElementById("tap-prev").addEventListener("click", prev);
document.getElementById("tap-next").addEventListener("click", next);
document.getElementById("arrow-prev").addEventListener("click", prev);
document.getElementById("arrow-next").addEventListener("click", next);

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "PageUp")  { prev(); e.preventDefault(); }
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { next(); e.preventDefault(); }
  if (e.key === "Home") go(0);
  if (e.key === "End")  go(SLIDES.length - 1);
});

let touchStart = null;
const SWIPE_MIN = 48;
document.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) return;
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
}, { passive: true });
document.addEventListener("touchend", e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  const dt = Date.now() - touchStart.t;
  if (Math.abs(dx) > SWIPE_MIN && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 800) {
    if (dx < 0) next(); else prev();
  }
  touchStart = null;
}, { passive: true });

function syncFromHash() {
  const h = location.hash.replace(/^#/, "");
  if (!h) return;
  const idx = SLIDES.findIndex(s => s.kind === h);
  if (idx !== -1) currentIndex = idx;
}
window.addEventListener("hashchange", () => { syncFromHash(); renderCurrent(); });

/* Offline banner */
(function setupOfflineIndicator() {
  const banner = document.createElement("div");
  banner.id = "offline-banner";
  banner.textContent = "OFFLINE · USING CACHE";
  document.body.appendChild(banner);
  const sync = () => {
    if (navigator.onLine) banner.classList.remove("visible");
    else banner.classList.add("visible");
  };
  window.addEventListener("online", sync);
  window.addEventListener("offline", sync);
  sync();
})();

/* Force refresh — purges SW cache, reloads */
function forceRefresh() {
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      Promise.all(regs.map(r => r.unregister())).then(() => {
        if ("caches" in window) {
          caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).then(() => {
            location.reload();
          });
        } else {
          location.reload();
        }
      });
    });
  } else {
    location.reload();
  }
}

/* Add-to-Home hint (iOS Safari only, first visit, not standalone) */
(function showA2HSHint() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.navigator.standalone === true;
  const dismissed = localStorage.getItem("r6iii-a2hs-dismissed");
  if (!isIOS || isStandalone || dismissed) return;
  const hint = document.createElement("div");
  hint.id = "a2hs-hint";
  hint.className = "visible";
  hint.innerHTML = "Tap <strong>Share</strong> → <strong>Add to Home Screen</strong> for offline use. <button>Got it</button>";
  document.body.appendChild(hint);
  hint.querySelector("button").addEventListener("click", () => {
    hint.classList.remove("visible");
    localStorage.setItem("r6iii-a2hs-dismissed", "1");
  });
})();

/* Init */
syncFromHash();
renderCurrent();
</script>

    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
